<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База ТЗ — Керування автопарком</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1b3022;
            color: #fff;
            margin: 0;
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        .sidebar {
            width: 340px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-right: 2px solid #2ecc71;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .main-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(255,255,255,0.02);
        }

        h2 {
            color: #2ecc71;
            font-size: 18px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(46,204,113,0.3);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group { margin-bottom: 10px; }
        .form-group label {
            font-size: 10px;
            color: #bdc3c7;
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            box-sizing: border-box;
            background: #fff;
            color: #000;
            font-size: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { font-size: 11px; color: #f1c40f; margin: 0; cursor: pointer; }

        .btn-save {
            background: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
            font-size: 13px;
        }
        .btn-save:hover { background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.4); }
        .btn-back {
            background: #34495e;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            margin-top: 15px;
            text-decoration: none;
            display: block;
            text-align: center;
            font-size: 11px;
        }

        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 6px;
        }
        .category-block {
            background: rgba(0,0,0,0.2);
            border: 1px dashed rgba(46,204,113,0.4);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            min-height: 80px;
        }
        .category-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .car-card {
            background: rgba(255,255,255,0.08);
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: grab;
            position: relative;
            transition: 0.2s;
            animation: fadeIn 0.3s;
        }
        .car-card:hover { border-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .car-card.dragging { opacity: 0.4; }

        .car-main-info { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .car-name { font-size: 14px; font-weight: bold; color: #2ecc71; }
        .car-plate { font-size: 12px; background: #fff; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; margin-left: 8px; }

        .car-details {
            display: none;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 0 0 6px 6px;
        }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; color: #ecf0f1; }
        .detail-grid b { color: #f1c40f; }

        .btn-mini-del {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 4px;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .btn-mini-del:hover { background: #e74c3c; color: #fff; }

        .btn-select-calc {
            background: #2980b9;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>➕ Нове авто</h2>

    <div class="form-group">
        <label>Марка та Модель ТЗ:</label>
        <input type="text" id="n_name" placeholder="Напр: ГАЗ-66">
    </div>

    <div class="form-group">
        <label>Номерний знак:</label>
        <input type="text" id="n_plate" placeholder="Напр: ВВ 0001 АА">
    </div>

    <div class="form-group">
        <label>Вид / Категорія ТЗ:</label>
        <select id="n_category"></select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group"><label>Hs (л/100км):</label><input type="number" id="n_hsm" step="0.01" value="0.0"></div>
        <div class="form-group"><label>Hw (л/100т·км):</label><input type="number" id="n_hw" step="0.01" value="1.3"></div>
    </div>

    <div class="checkbox-group" onclick="document.getElementById('n_has_cargo').click()">
        <input type="checkbox" id="n_has_cargo" onclick="event.stopPropagation(); toggleCargoInput()">
        <label>Вантажний ТЗ</label>
    </div>
    <div class="form-group" id="cargo_input_box" style="display: none;">
        <label>Макс. вантажопідйомність (тонн):</label>
        <input type="number" id="n_max_payload" step="0.1" value="4.5">
    </div>

    <div class="checkbox-group" onclick="document.getElementById('n_has_adblue').click()">
        <input type="checkbox" id="n_has_adblue" onclick="event.stopPropagation(); toggleAdBlueInput()">
        <label>Використовує AdBlue</label>
    </div>
    <div class="form-group" id="adblue_input_box" style="display: none;">
        <label>Норма AdBlue (% від пального):</label>
        <input type="number" id="n_adblue_rate" step="0.1" value="4.0">
    </div>

    <div style="font-size: 9px; color: #2ecc71; margin-top: 5px; text-align: center; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
        НОРМИ ОЛИВ (л) на 100 л ПАЛИВА
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 5px;">
        <div class="form-group"><label>Мот. (M):</label><input type="number" id="n_om" step="0.01" value="2.7"></div>
        <div class="form-group"><label>Транс. (T):</label><input type="number" id="n_ot" step="0.01" value="0.3"></div>
        <div class="form-group"><label>Спец. (S):</label><input type="number" id="n_os" step="0.01" value="0.1"></div>
        <div class="form-group"><label>Пласт. (P):</label><input type="number" id="n_op" step="0.01" value="0.2"></div>
    </div>

    <button class="btn-save" onclick="addCar()">💾 Зберегти в базу</button>

    <a href="{% url 'calc' %}" class="btn-back">← На калькулятор</a>
</div>

<div class="main-container">
    <div class="top-toolbar">
        <div>
            <button onclick="addCustomCategory()" style="background:#8e44ad; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:11px;">
                ➕ Створити новий вид ТЗ
            </button>
        </div>
        <div>
            <span style="font-size:11px; color:#aaa; margin-right:5px;">Сортування:</span>
            <button onclick="sortCars('name')" style="background:#34495e; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:11px;">
                За назвою (А-Я)
            </button>
        </div>
    </div>

    <div id="categoryContainer"></div>
</div>

<script>
    const CURRENT_USER_ID = "{{ user.id|default:0 }}";
    const CARS_STORAGE_KEY = 'cars_user_' + CURRENT_USER_ID;
    const CATS_STORAGE_KEY = 'car_categories_user_' + CURRENT_USER_ID;
    const SELECTED_CAR_ID_KEY = 'selected_car_id_user_' + CURRENT_USER_ID;
    const SELECTED_CAR_KEY = 'selectedCar_user_' + CURRENT_USER_ID;

    let dbCars = {};
    let categories = JSON.parse(localStorage.getItem(CATS_STORAGE_KEY)) || ["Вантажні", "Легкові", "Спеціальні", "Автобуси"];

    function toggleCargoInput() {
        const cargoBox = document.getElementById('cargo_input_box');
        if (cargoBox) {
            cargoBox.style.display = document.getElementById('n_has_cargo').checked ? 'block' : 'none';
        }
    }

    function toggleAdBlueInput() {
        const adblueBox = document.getElementById('adblue_input_box');
        if (adblueBox) {
            adblueBox.style.display = document.getElementById('n_has_adblue').checked ? 'block' : 'none';
        }
    }

    function updateCategorySelect() {
        const select = document.getElementById('n_category');
        if (!select) return;
        select.innerHTML = '';
        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }

    function fetchCarsFromDB() {
        const formData = new FormData();
        formData.append('action', 'fetch_cars');

        fetch('/api/cars/', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if (res && res.success) {
                    dbCars = {};
                    res.data.forEach(item => {
                        const uniqueKey = item.name + '_' + item.plate;
                        dbCars[uniqueKey] = {
                            db_id: item.id,
                            id: uniqueKey,
                            name: item.name,
                            plate: item.plate || 'Б/Н',
                            category: item.category || 'Вантажні',
                            hsm: parseFloat(item.hs),
                            hsz: parseFloat(item.hw),
                            hasCargo: item.has_cargo,
                            maxPayload: parseFloat(item.max_payload),
                            hasAdBlue: item.has_adblue,
                            adBlueRate: parseFloat(item.adblue),
                            om: parseFloat(item.om),
                            ot: parseFloat(item.ot),
                            os: parseFloat(item.os),
                            op: parseFloat(item.op)
                        };

                        if (item.category && !categories.includes(item.category)) {
                            categories.push(item.category);
                        }
                    });

                    localStorage.setItem(CATS_STORAGE_KEY, JSON.stringify(categories));
                    localStorage.setItem(CARS_STORAGE_KEY, JSON.stringify(dbCars));
                    render();
                }
            })
            .catch(err => console.error("Помилка завантаження автомобілів:", err));
    }

    function addCustomCategory() {
        const newCat = prompt("Введіть назву нового виду/категорії ТЗ:");
        if (newCat && newCat.trim()) {
            const cleanCat = newCat.trim();
            if (!categories.includes(cleanCat)) {
                categories.push(cleanCat);
                localStorage.setItem(CATS_STORAGE_KEY, JSON.stringify(categories));
                updateCategorySelect();
                render();
            }
        }
    }

    function render() {
        updateCategorySelect();
        const container = document.getElementById('categoryContainer');
        if (!container) return;
        container.innerHTML = "";

        if (Object.keys(dbCars).length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">База автомобілів порожня. Додайте перше авто ліворуч.</div>';
            return;
        }

        categories.forEach(cat => {
            const catBox = document.createElement('div');
            catBox.className = 'category-block';
            catBox.dataset.category = cat;

            catBox.ondragover = (e) => e.preventDefault();
            catBox.ondrop = (e) => dropCarToCategory(e, cat);

            let html = `<div class="category-title">
                            <span>📁 ${cat}</span>
                            <button onclick="deleteCategory('${cat}')" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:11px;" title="Видалити категорію">🗑️</button>
                        </div>`;

            let hasCars = false;
            for (let id in dbCars) {
                const car = dbCars[id];
                const carCat = car.category || "Вантажні";

                if (carCat === cat) {
                    hasCars = true;
                    html += `
                        <div class="car-card" draggable="true" ondragstart="dragCar(event, '${id}')" onclick="toggleDetails('${id}')">
                            <button class="btn-mini-del" onclick="event.stopPropagation(); deleteCar('${id}', ${car.db_id})" title="Видалити">✕</button>
                            <div class="car-main-info">
                                <div>
                                    <span class="car-name">🚗 ${car.name}</span>
                                    <span class="car-plate">${car.plate || 'Б/Н'}</span>
                                </div>
                                <span style="color:#888; font-size:10px; text-transform:uppercase;">Детальніше ▾</span>
                            </div>
                            <div id="details-${id}" class="car-details">
                                <div class="detail-grid">
                                    <span><b>Hs (базова):</b> ${car.hsm} л</span>
                                    <span><b>Hw (вантаж):</b> ${car.hsz || 0} л</span>
                                    <span><b>Макс. вантаж:</b> ${car.maxPayload ? car.maxPayload + ' т' : 'Н/Д'}</span>
                                    <span><b>AdBlue норма:</b> ${car.hasAdBlue ? car.adBlueRate + '%' : 'Ні'}</span>
                                    <span><b>Моторна (M):</b> ${car.om} л</span>
                                    <span><b>Трансм. (T):</b> ${car.ot} л</span>
                                    <span><b>Спеціальна (S):</b> ${car.os} л</span>
                                    <span><b>Пластична (P):</b> ${car.op} л</span>
                                </div>
                                <button class="btn-select-calc" onclick="event.stopPropagation(); selectForCalc('${id}')">Обрати для розрахунку</button>
                            </div>
                        </div>`;
                }
            }

            if (!hasCars) {
                html += `<div style="font-size:11px; color:#555; text-align:center; padding:10px;">Перетягніть сюди авто або додайте нове</div>`;
            }

            catBox.innerHTML = html;
            container.appendChild(catBox);
        });
    }

    function dragCar(e, id) {
        e.dataTransfer.setData("text/plain", id);
    }

    function dropCarToCategory(e, newCat) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text/plain");

        if (dbCars[id]) {
            dbCars[id].category = newCat;

            const formData = new FormData();
            formData.append('action', 'update_category');
            formData.append('id', dbCars[id].db_id);
            formData.append('category', newCat);

            fetch('/api/cars/', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        localStorage.setItem(CARS_STORAGE_KEY, JSON.stringify(dbCars));
                        render();
                    }
                });
        }
    }

    function toggleDetails(id) {
        const el = document.getElementById('details-' + id);
        if (!el) return;
        const isVisible = el.style.display === 'block';
        document.querySelectorAll('.car-details').forEach(d => d.style.display = 'none');
        el.style.display = isVisible ? 'none' : 'block';
    }

    function addCar() {
        const name = document.getElementById('n_name').value.trim();
        const plate = document.getElementById('n_plate').value.trim();

        if (!name) {
            alert("Помилка: Введіть марку/модель автомобіля!");
            return;
        }

        const hasCargo = document.getElementById('n_has_cargo').checked;
        const hasAdBlue = document.getElementById('n_has_adblue').checked;

        const formData = new FormData();
        formData.append('action', 'add_car');
        formData.append('name', name);
        formData.append('plate', plate || 'Б/Н');
        formData.append('category', document.getElementById('n_category').value);
        formData.append('hs', parseFloat(document.getElementById('n_hsm').value) || 0);
        formData.append('hw', parseFloat(document.getElementById('n_hw').value) || 0);
        formData.append('has_cargo', hasCargo ? '1' : '0');
        formData.append('max_payload', hasCargo ? (parseFloat(document.getElementById('n_max_payload').value) || 0) : 0);
        formData.append('om', parseFloat(document.getElementById('n_om').value) || 0);
        formData.append('ot', parseFloat(document.getElementById('n_ot').value) || 0);
        formData.append('os', parseFloat(document.getElementById('n_os').value) || 0);
        formData.append('op', parseFloat(document.getElementById('n_op').value) || 0);
        formData.append('has_adblue', hasAdBlue ? '1' : '0');
        formData.append('adblue', hasAdBlue ? (parseFloat(document.getElementById('n_adblue_rate').value) || 0) : 0);

        fetch('/api/cars/', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if (res && res.success) {
                    alert("Автомобіль успішно збережено у вашій базі даних!");
                    document.getElementById('n_name').value = "";
                    document.getElementById('n_plate').value = "";
                    fetchCarsFromDB();
                } else {
                    alert("Помилка збереження: " + (res.message || "Невідома помилка"));
                }
            })
            .catch(err => alert("Помилка відправки даних на сервер"));
    }

    function deleteCar(key, db_id) {
        if (confirm("Видалити цей автомобіль з бази даних?")) {
            const formData = new FormData();
            formData.append('action', 'delete_car');
            formData.append('id', db_id);

            fetch('/api/cars/', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        delete dbCars[key];
                        localStorage.setItem(CARS_STORAGE_KEY, JSON.stringify(dbCars));

                        if (localStorage.getItem(SELECTED_CAR_ID_KEY) === key) {
                            localStorage.removeItem(SELECTED_CAR_ID_KEY);
                            localStorage.removeItem(SELECTED_CAR_KEY);
                        }

                        render();
                    } else {
                        alert("Не вдалося видалити автомобіль з БД");
                    }
                });
        }
    }

    function deleteCategory(cat) {
        if (categories.length <= 1) {
            alert("Повинна залишатися хоча б одна категорія!");
            return;
        }
        if (confirm(`Видалити категорію "${cat}"? Автомобілі перемістяться в перший доступний вид.`)) {
            categories = categories.filter(c => c !== cat);
            localStorage.setItem(CATS_STORAGE_KEY, JSON.stringify(categories));

            for (let id in dbCars) {
                if (dbCars[id].category === cat) {
                    dbCars[id].category = categories[0];
                    dropCarToCategory({ preventDefault: () => {} }, categories[0]);
                }
            }
            render();
        }
    }

    function sortCars(type) {
        let sortedEntries = Object.entries(dbCars).sort((a, b) => a[1].name.localeCompare(b[1].name));
        let newDb = {};
        sortedEntries.forEach(([key, val]) => { newDb[key] = val; });
        dbCars = newDb;
        render();
    }

    function selectForCalc(id) {
        const car = dbCars[id];
        if (!car) return;

        localStorage.setItem(SELECTED_CAR_KEY, JSON.stringify(car));
        localStorage.setItem(SELECTED_CAR_ID_KEY, id);

        window.location.href = '{% url "calc" %}';
    }

    window.onload = fetchCarsFromDB;
</script>

</body>
</html>
