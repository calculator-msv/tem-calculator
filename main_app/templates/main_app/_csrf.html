<script>
/* CSRF: до кожного POST-запиту на цей самий сайт додаємо заголовок X-CSRFToken.
   Запити на зовнішні сайти (карти, геокодер) не змінюються. */
(function () {
    var token = "{{ csrf_token }}";
    var nativeFetch = window.fetch;
    window.fetch = function (input, init) {
        init = init || {};
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        var sameOrigin = url.charAt(0) === '/' || url.indexOf(location.origin + '/') === 0;
        var method = (init.method || (input && input.method) || 'GET').toUpperCase();
        if (sameOrigin && method !== 'GET' && method !== 'HEAD') {
            var headers = new Headers(init.headers || (input && input.headers) || {});
            if (!headers.has('X-CSRFToken')) headers.set('X-CSRFToken', token);
            init = Object.assign({}, init, { headers: headers });
        }
        return nativeFetch.call(this, input, init);
    };
})();
</script>
<script>
/* Повідомлення без системного вікна «Повідомлення з …»:
   alert("текст") показує короткий напис знизу екрана, який зникає сам і нічого не блокує.
   Помилки (текст починається з «Помилка» / «Не вдалося» / «Не знайдено» тощо) — червоні, решта — зелені. */
(function () {
    var box = null;
    function getBox() {
        if (box && document.body.contains(box)) return box;
        box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;' +
            'display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;pointer-events:none;';
        document.body.appendChild(box);
        return box;
    }
    function isError(text) {
        return /^(помилка|не вдалос|не вдає|не знайдено|невалід|будь ласка|введіть|заповніть|оберіть|додайте|немає|не можна)/i.test(text) ||
            /помилк/i.test(text);
    }
    window.alert = function (message) {
        var text = String(message == null ? '' : message).trim();
        if (!text) return;
        var el = document.createElement('div');
        var err = isError(text);
        el.textContent = text;
        el.style.cssText = 'pointer-events:auto;box-sizing:border-box;width:100%;padding:11px 16px;border-radius:8px;' +
            'font:600 13px/1.35 system-ui,Segoe UI,Arial,sans-serif;color:#fff;text-align:center;cursor:pointer;' +
            'box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;transition:opacity .2s;' +
            'background:' + (err ? '#c0392b' : '#1e8449') + ';border:1px solid ' + (err ? '#e74c3c' : '#2ecc71') + ';';
        function close() { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 250); }
        el.onclick = close;
        getBox().appendChild(el);
        requestAnimationFrame(function () { el.style.opacity = '1'; });
        setTimeout(close, err ? 5000 : 2800);
    };
})();
</script>
<script>
/* Безпека сеансу: після закриття вкладки або тривалого «згортання» сайту потрібно входити знову.
   Змініть AWAY_MINUTES, щоб змінити час, після якого сайт вимагатиме повторний вхід. */
(function () {
    var AWAY_MINUTES = 5;
    var KEY = 'tem_tab', HID = 'tem_hidden_at';
    function get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
    var loggedIn = {% if user.is_authenticated %}true{% else %}false{% endif %};
    function leave() { del(KEY); del(HID); location.replace('{% url "logout" %}'); }
    if (!loggedIn) { set(KEY, '1'); del(HID); return; }
    /* Вкладку відкрито заново (закрили й повернулися) — без позначки вкладки сеанс не діє. */
    if (!get(KEY)) { leave(); return; }
    function check() {
        var t = parseInt(get(HID) || '0', 10);
        if (t && Date.now() - t > AWAY_MINUTES * 60000) { leave(); return true; }
        del(HID);
        return false;
    }
    if (check()) return;
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) set(HID, String(Date.now())); else check();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();
</script>
